<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;padding:40px 24px;">
      <tr>
        <td>
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Confirm your email address</h1>
          <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">
            Welcome to Zerocraft. Click the button below to confirm your email address and finish creating your account.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup"
               style="display:inline-block;padding:14px 24px;border-radius:8px;background:#111827;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none;">
              Confirm email address
            </a>
          </p>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280;">
            This link expires shortly and can only be used once. If you did not create a Zerocraft account, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
