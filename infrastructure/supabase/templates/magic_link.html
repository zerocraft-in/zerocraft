<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;padding:40px 24px;">
      <tr>
        <td>
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Your Zerocraft sign-in code</h1>
          <p style="margin:0 0 20px;font-size:16px;line-height:1.6;">
            Enter this 6-digit code to sign in to your account:
          </p>
          <p style="margin:0 0 20px;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:10px;color:#111827;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280;">
            This code expires shortly and can only be used once. If you did not request it, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
